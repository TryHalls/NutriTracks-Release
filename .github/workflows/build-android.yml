name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Capacitor
      run: npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
    
    - name: Remove existing android folder
      run: rm -rf android
    
    - name: Initialize Capacitor
      run: npx cap init NutriTracks com.dylang.nutritracks --web-dir=www || true
    
    - name: Add Android (fresh)
      run: npx cap add android
    
    - name: Sync
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NutriTracks-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
