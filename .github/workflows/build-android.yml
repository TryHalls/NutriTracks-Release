name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Capacitor
      run: npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
    
    - name: Initialize Capacitor
      run: npx cap init NutriTracks com.dylang.nutritracks --web-dir=www || true
    
    - name: Add Android (fresh)
      run: npx cap add android
    
    - name: Sync
      run: npx cap sync android
    
    - name: Setup Gradle manually
      run: |
        cd android
        # Descargar Gradle wrapper si no existe
        if [ ! -f gradlew ]; then
          echo "Downloading Gradle wrapper..."
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip gradle-8.2-bin.zip
          export GRADLE_HOME=$(pwd)/gradle-8.2
          export PATH=$GRADLE_HOME/bin:$PATH
          echo "Gradle installed at $GRADLE_HOME"
        fi
    
    - name: Build APK
      run: |
        cd android
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          # Usar Gradle directamente
          gradle-8.2/bin/gradle assembleDebug --no-daemon
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NutriTracks-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
