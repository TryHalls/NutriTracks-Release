name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Install npm dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
    
    - name: Create www folder if not exists
      run: |
        mkdir -p www
        if [ ! -f www/index.html ]; then
          if [ -f index.html ]; then
            cp index.html www/
          fi
        fi
    
    - name: Initialize Capacitor
      run: |
        npx cap init NutriTracks com.dylang.nutritracks --web-dir=www --force || true
    
    - name: Add Android platform
      run: |
        npx cap add android || true
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    # ---- NUEVO PASO: decodificar el keystore ----
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
    
    # ---- NUEVO PASO: compilar en RELEASE con las variables de entorno ----
    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        export KEYSTORE_PATH=app/release.keystore
        export KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
        export KEY_ALIAS=${{ secrets.KEY_ALIAS }}
        export KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
        ./gradlew assembleRelease --stacktrace
    
    # ---- Subimos la APK de release ----
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NutriTracks-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 5
