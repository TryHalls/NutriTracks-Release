name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Install npm dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
    
    - name: Create www folder if not exists
      run: |
        mkdir -p www
        if [ ! -f www/index.html ]; then
          if [ -f index.html ]; then
            cp index.html www/
          fi
        fi
    
    - name: Initialize Capacitor
      run: |
        npx cap init NutriTracks com.dylang.nutritracks --web-dir=www --force || true
    
    - name: Add Android platform
      run: |
        npx cap add android || true
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    # ---- Decodificar el keystore en la carpeta correcta ----
    - name: Decode Keystore
      run: |
        mkdir -p android/app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
    
    # ---- Verificar que el keystore se creó correctamente ----
    - name: Verify Keystore
      run: |
        ls -la android/app/release.keystore
        file android/app/release.keystore
        keytool -list -keystore android/app/release.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }} || echo "Verificación fallida, revisa contraseñas o alias"
    
    # ---- Compilar en RELEASE con las variables de entorno ----
    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
    
    # ---- Subir la APK de release ----
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NutriTracks-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 5
